name: Update Visitor Statistics

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refresh cumulative pageviews
        run: python3 .github/scripts/update_visitor_stats.py

      - name: Commit updated statistics
        run: |
          if git diff --quiet -- data/visitor-stats.json; then
            echo "Visitor statistics are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/visitor-stats.json
          git commit -m "Update visitor statistics"
          git push
