---
layout: compress
---

<!doctype html>
<html lang="en" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
    <base href="{{ '/' | absolute_url }}">
    <style>
      html,
      body {
        min-height: 100%;
      }

      body.homepage-minimal {
        min-height: 100svh;
        color: #14283d;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.18) 100%),
          url("/images/homepage-geoai-wallpaper-light.png") center / cover no-repeat fixed;
      }

      .homepage-minimal .masthead {
        position: absolute;
        z-index: 10;
        width: 100%;
        border-bottom: 1px solid rgba(38, 69, 99, 0.14);
        background: rgba(255, 254, 250, 0.64);
        box-shadow: none;
        backdrop-filter: blur(12px);
      }

      .homepage-minimal .greedy-nav,
      .homepage-minimal .greedy-nav a,
      .homepage-minimal .masthead__menu-item a {
        background: transparent;
        color: #243b53;
      }

      .homepage-minimal .greedy-nav a:hover {
        color: #0b6e8a;
      }

      .homepage-minimal .greedy-nav__toggle {
        border-color: rgba(38, 69, 99, 0.25);
        background: rgba(255, 255, 255, 0.58);
        color: #243b53;
      }

      .homepage-minimal .hidden-links {
        border: 1px solid rgba(38, 69, 99, 0.14);
        background: rgba(255, 254, 250, 0.97);
        box-shadow: 0 0.8rem 2.5rem rgba(37, 56, 78, 0.14);
        backdrop-filter: blur(16px);
      }

      .homepage-minimal .hidden-links a {
        color: #243b53;
      }

      .homepage-minimal__main {
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: 7.25rem 1.5rem 2.5rem;
      }

      .homepage-minimal__panel {
        width: min(100%, 31rem);
        padding: clamp(1.5rem, 4vw, 2.35rem);
        border: 1px solid rgba(38, 69, 99, 0.18);
        border-radius: 1.1rem;
        background: rgba(255, 255, 255, 0.62);
        box-shadow: 0 1.2rem 4rem rgba(37, 56, 78, 0.14);
        text-align: center;
        backdrop-filter: blur(16px);
      }

      .homepage-minimal__name {
        margin: 0;
        color: #18344e;
        font-size: clamp(1.8rem, 5vw, 2.7rem);
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .homepage-minimal__focus {
        margin: 0.45rem 0 1.45rem;
        color: #52697f;
        font-size: clamp(0.92rem, 2.5vw, 1.04rem);
      }

      .homepage-minimal__links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.58rem;
      }

      .homepage-minimal__links a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 6.9rem;
        padding: 0.58rem 0.78rem;
        border: 1px solid rgba(38, 69, 99, 0.24);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.68);
        color: #1d4563;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
      }

      .homepage-minimal__links a:hover,
      .homepage-minimal__links a:focus-visible {
        transform: translateY(-1px);
        border-color: rgba(18, 117, 145, 0.6);
        background: rgba(222, 244, 246, 0.85);
        color: #123e5a;
      }

      @media (max-width: 640px) {
        body.homepage-minimal {
          background-position: 56% center;
          background-attachment: scroll;
        }

        .homepage-minimal__main {
          padding-top: 6rem;
        }

        .homepage-minimal__panel {
          padding: 1.45rem 1.1rem;
        }
      }
    </style>
  </head>

  <body class="homepage-minimal">
    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <main class="homepage-minimal__main" aria-labelledby="homepage-title">
      <section class="homepage-minimal__panel">
        <h1 id="homepage-title" class="homepage-minimal__name">Yifan Yang</h1>
        <p class="homepage-minimal__focus">Responsible &amp; Autonomous GeoAI</p>
        <nav class="homepage-minimal__links" aria-label="Homepage shortcuts">
          <a href="/about/">About</a>
          <a href="/news/">News</a>
          <a href="/publications/">Publications</a>
          <a href="/resume/Yifan_Yang_CV.pdf">Curriculum Vitae</a>
        </nav>
      </section>
    </main>

    {% include scripts.html %}
  </body>
</html>
