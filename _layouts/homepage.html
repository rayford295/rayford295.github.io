---
layout: compress
---

<!doctype html>
<html lang="en" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
    <base href="{{ '/' | absolute_url }}">
    <style>
      html,
      body {
        min-height: 100%;
      }

      body.homepage-minimal {
        position: relative;
        isolation: isolate;
        min-height: 100svh;
        color: #14283d;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.18) 100%),
          url("/images/homepage-geoai-wallpaper-ai-reading.png") center / cover no-repeat fixed;
      }

      body.homepage-minimal::before {
        position: fixed;
        z-index: 0;
        inset: -14%;
        background:
          radial-gradient(ellipse at 18% 72%, rgba(187, 222, 235, 0.22), transparent 35%),
          radial-gradient(ellipse at 78% 23%, rgba(235, 215, 177, 0.18), transparent 34%);
        content: "";
        opacity: 0.72;
        pointer-events: none;
        transform: translate3d(-1%, 0.8%, 0) scale(1.02);
        animation: homepage-aura-drift 18s ease-in-out infinite alternate;
      }

      .homepage-ribbons {
        position: fixed;
        z-index: 0;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .homepage-ribbon {
        position: absolute;
        display: block;
        height: 0.82rem;
        border-radius: 999px;
        opacity: 0.56;
        will-change: transform;
      }

      .homepage-ribbon--blue {
        bottom: 10vh;
        left: -13rem;
        width: min(58rem, 62vw);
        background: linear-gradient(90deg, transparent, rgba(60, 118, 161, 0.5) 33%, rgba(109, 171, 197, 0.58) 57%, transparent);
        transform: rotate(-17deg);
        animation: homepage-ribbon-blue 24s ease-in-out infinite alternate;
      }

      .homepage-ribbon--gold {
        top: 15vh;
        right: -17rem;
        width: min(49rem, 54vw);
        height: 0.64rem;
        background: linear-gradient(90deg, transparent, rgba(201, 159, 83, 0.5) 34%, rgba(232, 196, 125, 0.55) 57%, transparent);
        transform: rotate(-31deg);
        animation: homepage-ribbon-gold 28s ease-in-out infinite alternate;
      }

      .homepage-ribbon--cyan {
        top: 23vh;
        left: -19rem;
        width: min(45rem, 52vw);
        height: 0.58rem;
        background: linear-gradient(90deg, transparent, rgba(111, 192, 208, 0.42) 38%, rgba(177, 224, 229, 0.48) 58%, transparent);
        transform: rotate(21deg);
        animation: homepage-ribbon-cyan 31s ease-in-out infinite alternate;
      }

      .homepage-minimal .masthead {
        position: absolute;
        z-index: 10;
        width: 100%;
        border-bottom: 1px solid rgba(38, 69, 99, 0.14);
        background: rgba(255, 254, 250, 0.64);
        box-shadow: none;
        backdrop-filter: blur(12px);
      }

      .homepage-minimal .greedy-nav,
      .homepage-minimal .greedy-nav a,
      .homepage-minimal .masthead__menu-item a {
        background: transparent;
        color: #243b53;
      }

      .homepage-minimal .greedy-nav a:hover {
        color: #0b6e8a;
      }

      .homepage-minimal .greedy-nav__toggle {
        border-color: rgba(38, 69, 99, 0.25);
        background: rgba(255, 255, 255, 0.58);
        color: #243b53;
      }

      .homepage-minimal .hidden-links {
        border: 1px solid rgba(38, 69, 99, 0.14);
        background: rgba(255, 254, 250, 0.97);
        box-shadow: 0 0.8rem 2.5rem rgba(37, 56, 78, 0.14);
        backdrop-filter: blur(16px);
      }

      .homepage-minimal .hidden-links a {
        color: #243b53;
      }

      .homepage-minimal__main {
        position: relative;
        z-index: 1;
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: 7.25rem 1.5rem 2.5rem;
      }

      .homepage-minimal__panel {
        width: min(100%, 31rem);
        padding: clamp(1.5rem, 4vw, 2.35rem);
        border: 1px solid rgba(38, 69, 99, 0.18);
        border-radius: 1.1rem;
        background: rgba(255, 255, 255, 0.62);
        box-shadow: 0 1.2rem 4rem rgba(37, 56, 78, 0.14);
        text-align: center;
        backdrop-filter: blur(16px);
      }

      .homepage-minimal__name {
        margin: 0;
        color: #18344e;
        font-size: clamp(1.8rem, 5vw, 2.7rem);
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .homepage-minimal__links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.58rem;
        margin-top: 1.35rem;
      }

      .homepage-minimal__links a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 6.9rem;
        padding: 0.58rem 0.78rem;
        border: 1px solid rgba(38, 69, 99, 0.24);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.68);
        color: #1d4563;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
      }

      .homepage-minimal__links a:hover,
      .homepage-minimal__links a:focus-visible {
        transform: translateY(-1px);
        border-color: rgba(18, 117, 145, 0.6);
        background: rgba(222, 244, 246, 0.85);
        color: #123e5a;
      }

      @keyframes homepage-aura-drift {
        from {
          transform: translate3d(-1%, 0.8%, 0) scale(1.02);
        }

        to {
          transform: translate3d(1.4%, -1%, 0) scale(1.06);
        }
      }

      @keyframes homepage-ribbon-blue {
        from { transform: rotate(-17deg) translate3d(-1.2rem, 0, 0); }
        to { transform: rotate(-15deg) translate3d(2rem, -0.7rem, 0); }
      }

      @keyframes homepage-ribbon-gold {
        from { transform: rotate(-31deg) translate3d(0, 0, 0); }
        to { transform: rotate(-28deg) translate3d(-2.1rem, 0.8rem, 0); }
      }

      @keyframes homepage-ribbon-cyan {
        from { transform: rotate(21deg) translate3d(0, 0, 0); }
        to { transform: rotate(18deg) translate3d(1.4rem, 0.85rem, 0); }
      }

      @media (prefers-reduced-motion: reduce) {
        body.homepage-minimal::before,
        .homepage-ribbon {
          animation: none;
        }

        body.homepage-minimal::before {
          transform: none;
        }
      }

      @media (max-width: 640px) {
        body.homepage-minimal {
          background-position: 56% center;
          background-attachment: scroll;
        }

        .homepage-minimal__main {
          padding-top: 6rem;
        }

        .homepage-minimal__panel {
          padding: 1.45rem 1.1rem;
        }
      }
    </style>
  </head>

  <body class="homepage-minimal">
    {% include browser-upgrade.html %}
    <div class="homepage-ribbons" aria-hidden="true">
      <span class="homepage-ribbon homepage-ribbon--blue"></span>
      <span class="homepage-ribbon homepage-ribbon--gold"></span>
      <span class="homepage-ribbon homepage-ribbon--cyan"></span>
    </div>
    {% include masthead.html %}

    <main class="homepage-minimal__main" aria-labelledby="homepage-title">
      <section class="homepage-minimal__panel">
        <h1 id="homepage-title" class="homepage-minimal__name">Yifan Yang</h1>
        <nav class="homepage-minimal__links" aria-label="Homepage shortcuts">
          <a href="/about/">About</a>
          <a href="/news/">News</a>
          <a href="/publications/">Publications</a>
          <a href="/resume/Yifan_Yang_CV.pdf">Curriculum Vitae</a>
          <a href="https://github.com/rayford295" target="_blank" rel="noopener">GitHub</a>
          <a href="https://autogeoai4sci.github.io/" target="_blank" rel="noopener">AutoGeoAI4Sci</a>
        </nav>
      </section>
    </main>

    {% include scripts.html %}
  </body>
</html>
