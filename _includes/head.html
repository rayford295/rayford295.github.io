<meta charset="utf-8">
{% assign site_build_version = site.time | date: '%Y%m%d%H%M%S' %}
<meta name="site-build-version" content="{{ site_build_version }}">
<script src="{{ '/assets/js/site-version-check.js' | relative_url }}?v={{ site_build_version }}" defer></script>

{% include seo.html %}

<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site_build_version }}">

<meta http-equiv="cleartype" content="on">
<head>
  <base target="_blank">
</head>
